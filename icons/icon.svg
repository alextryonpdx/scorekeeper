<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f8a5f"/>
      <stop offset="1" stop-color="#0e5c3c"/>
    </linearGradient>
    <g id="index-mark" fill="#d5342f" font-family="Georgia, 'Times New Roman', serif" font-weight="700">
      <text x="136" y="140" font-size="60" text-anchor="middle">A</text>
      <text x="136" y="184" font-size="38" text-anchor="middle">♥</text>
    </g>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- card -->
  <rect x="106" y="66" width="300" height="380" rx="26" fill="#fdfdfc"/>

  <!-- heart suit, centered -->
  <path d="M256 352
           C 176 288, 144 244, 144 197
           C 144 161, 172 137, 203 137
           C 226 137, 246 150, 256 170
           C 266 150, 286 137, 309 137
           C 340 137, 368 161, 368 197
           C 368 244, 336 288, 256 352 Z"
        fill="#d5342f"/>

  <!-- corner index marks (top-left, and its 180°-rotated mirror at bottom-right) -->
  <use href="#index-mark"/>
  <use href="#index-mark" transform="rotate(180 256 256)"/>
</svg>
